<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-modal AI Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8; --panel: #ffffff; --text: #1a1a1c; --muted: #6b6b73; --line: #dcdce0;
    --accent: #2f5bea; --accent-text: #ffffff; --user: #e8eeff; --bot: #f0f0f3; --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --panel: #1b1b1f; --text: #ececf0; --muted: #9a9aa5; --line: #34343b;
      --accent: #6f8cff; --accent-text: #0b0b10; --user: #243057; --bot: #26262c; --danger: #ef6a6a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { max-width: 820px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex;
         flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
  h1 { font-size: 1.1rem; margin: 0; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); padding: 8px 12px; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.rec { background: var(--danger); color: #fff; border-color: var(--danger); }
  #log { flex: 1; overflow-y: auto; padding: 8px 0; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  .msg { margin: 10px 0; padding: 10px 14px; border-radius: 14px; max-width: 88%;
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { background: var(--user); margin-left: auto; }
  .bot { background: var(--bot); }
  .err { color: var(--danger); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .thumbs img { height: 64px; border-radius: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: .85rem;
          border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  .chip button { border: 0; padding: 0 2px; background: none; color: var(--muted); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0; min-height: 0; }
  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 8px 0 16px; }
  textarea { flex: 1; resize: none; max-height: 160px; font: inherit; color: var(--text);
             background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
  #status { font-size: .8rem; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Multi-modal AI Assistant</h1>
    <button id="reset" type="button">New chat</button>
  </header>

  <div id="log" aria-live="polite">
    <div class="empty" id="empty">Ask anything. Attach images, PDFs, audio or text files,<br>
    drop them anywhere, paste a screenshot, or record your voice.</div>
  </div>

  <div id="chips"></div>
  <div id="status"></div>
  <form class="composer" id="form">
    <input type="file" id="file" multiple hidden
           accept="image/*,application/pdf,audio/*,.txt,.md,.csv,.json,.py,.js,.html,.css,.sql,.log">
    <button type="button" id="attach" title="Attach files" aria-label="Attach files">📎</button>
    <button type="button" id="mic" title="Record audio" aria-label="Record audio">🎤</button>
    <textarea id="text" rows="1" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
    <button type="submit" class="primary" id="send">Send</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const logEl = $("log"), chipsEl = $("chips"), statusEl = $("status");
const textEl = $("text"), sendBtn = $("send"), micBtn = $("mic");
const makeId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
let sessionId = makeId();
let pending = [];          // File objects waiting to be sent
let busy = false;
let recorder = null, recChunks = [], micStream = null;

function setStatus(msg) { statusEl.textContent = msg || ""; }

function renderChips() {
  chipsEl.replaceChildren();
  pending.forEach((f, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.append(document.createTextNode(f.name));
    const x = document.createElement("button");
    x.type = "button"; x.textContent = "✕"; x.setAttribute("aria-label", "Remove " + f.name);
    x.onclick = () => { pending.splice(i, 1); renderChips(); };
    chip.append(x);
    chipsEl.append(chip);
  });
}

function addFiles(list) {
  for (const f of list) pending.push(f);
  renderChips();
}

function addMessage(cls, text, files) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls;
  if (files && files.length) {
    const thumbs = document.createElement("div");
    thumbs.className = "thumbs";
    for (const f of files) {
      if (f.type.startsWith("image/")) {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(f); img.alt = f.name;
        thumbs.append(img);
      } else {
        const c = document.createElement("span");
        c.className = "chip"; c.textContent = f.name;
        thumbs.append(c);
      }
    }
    el.append(thumbs);
  }
  const body = document.createElement("div");
  body.textContent = text;       // textContent only: model output is never parsed as HTML
  el.append(body);
  logEl.append(el);
  logEl.scrollTop = logEl.scrollHeight;
  return body;
}

async function send() {
  const message = textEl.value.trim();
  if (busy || (!message && pending.length === 0)) return;
  busy = true; sendBtn.disabled = true;
  const files = pending; pending = []; renderChips();
  textEl.value = ""; textEl.style.height = "auto";
  addMessage("user", message, files);
  const out = addMessage("bot", "");
  setStatus("thinking…");

  const form = new FormData();
  form.append("session_id", sessionId);
  form.append("message", message);
  files.forEach((f) => form.append("files", f, f.name));

  try {
    const res = await fetch("/api/chat", { method: "POST", body: form });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (_) {}
      throw new Error(detail);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!raw.startsWith("data: ")) continue;
        const ev = JSON.parse(raw.slice(6));
        if (ev.type === "text") { out.textContent += ev.text; logEl.scrollTop = logEl.scrollHeight; setStatus(""); }
        else if (ev.type === "error") { out.parentElement.classList.add("err"); out.textContent += (out.textContent ? "\n" : "") + ev.text; }
      }
    }
  } catch (err) {
    out.parentElement.classList.add("err");
    out.textContent = err.message || "Request failed.";
  } finally {
    busy = false; sendBtn.disabled = false; setStatus(""); textEl.focus();
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
textEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
textEl.addEventListener("input", () => {
  textEl.style.height = "auto"; textEl.style.height = Math.min(textEl.scrollHeight, 160) + "px";
});

$("attach").onclick = () => $("file").click();
$("file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };

// drag & drop anywhere
const app = $("app");
["dragenter", "dragover"].forEach((t) => app.addEventListener(t, (e) => { e.preventDefault(); app.classList.add("drop"); }));
["dragleave", "drop"].forEach((t) => app.addEventListener(t, (e) => { e.preventDefault(); app.classList.remove("drop"); }));
app.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));

// paste screenshots / images
document.addEventListener("paste", (e) => {
  const imgs = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
  if (imgs.length) { e.preventDefault(); addFiles(imgs); }
});

// voice recording
micBtn.onclick = async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    micStream = micStream || await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (_) { setStatus("Microphone access was denied."); return; }
  recChunks = [];
  recorder = new MediaRecorder(micStream);
  recorder.ondataavailable = (e) => e.data.size && recChunks.push(e.data);
  recorder.onstop = () => {
    micBtn.classList.remove("rec"); micBtn.textContent = "🎤";
    const type = recorder.mimeType || "audio/webm";
    const ext = type.includes("ogg") ? "ogg" : type.includes("mp4") ? "m4a" : "webm";
    addFiles([new File([new Blob(recChunks, { type })], `voice-note.${ext}`, { type })]);
    setStatus("Voice note attached. Add a question or just press Send.");
  };
  recorder.start();
  micBtn.classList.add("rec"); micBtn.textContent = "⏹";
  setStatus("Recording… press ⏹ to stop.");
};

$("reset").onclick = async () => {
  if (busy) return;
  try { await fetch("/api/sessions/" + sessionId, { method: "DELETE" }); } catch (_) {}
  sessionId = makeId(); pending = []; renderChips();
  logEl.replaceChildren();
  const e = document.createElement("div"); e.className = "empty"; e.id = "empty";
  e.textContent = "New chat started."; logEl.append(e);
};
</script>
</body>
</html>
