[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-ai-assistant"
version = "0.1.0"
description = "Multi-modal AI assistant: chat with Claude using text, images, PDFs and audio, via a streaming web UI, REST API and CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
multimodal-assistant = "multimodal_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
